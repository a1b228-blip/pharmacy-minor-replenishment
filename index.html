<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>佳里奇美醫院 藥劑科小藥撥補單列印助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 解析與匯出函式庫) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2pdf.js (高畫質 PDF 匯出函式庫) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .dropzone-active {
            border-color: #0d9488 !important;
            background-color: #f0fdfa !important;
            transform: scale(1.008);
        }

        /* 螢幕預覽表格樣式 */
        .preview-table th, .preview-table td {
            border: 1px solid #cbd5e1;
            padding: 5px 6px;
            font-size: 11.5px;
            vertical-align: middle;
        }

        .preview-table th {
            background-color: #f1f5f9;
            font-weight: bold;
            text-align: center;
            white-space: pre-line;
        }

        /* 列印專用樣式 (@media print) - 最大化字體並維持單頁 A4 橫式 */
        @media print {
            @page {
                size: A4 landscape;
                margin: 4mm 4mm 4mm 4mm;
            }

            .no-print, header, nav, .upload-section, .controls-section, .action-buttons, footer {
                display: none !important;
            }

            html, body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                height: 100% !important;
                overflow: hidden !important;
            }

            #print-area {
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }

            .print-table {
                width: 100% !important;
                border-collapse: collapse !important;
                font-size: 8.3pt !important;
                line-height: 1.15 !important;
                table-layout: auto !important;
            }

            .print-table th, .print-table td {
                border: 0.8px solid #334155 !important;
                padding: 2px 2.5px !important;
                color: black !important;
                background: transparent !important;
            }

            .print-table th {
                background-color: #f1f5f9 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                font-weight: 700 !important;
                text-align: center !important;
                white-space: pre-line !important;
            }

            thead {
                display: table-header-group !important;
            }

            tr {
                page-break-inside: avoid !important;
            }

            .signature-block {
                margin-top: 10px !important;
                display: flex !important;
                justify-content: flex-end !important;
                gap: 32px !important;
                font-size: 9.5pt !important;
                font-weight: 600 !important;
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body class="p-3 sm:p-6">

    <div class="max-w-7xl mx-auto space-y-5">

        <!-- 頂部 Header -->
        <header class="no-print bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-teal-700 flex items-center justify-center text-white font-black text-xl shadow-sm">
                    奇美
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">佳里奇美醫院 藥劑科小藥撥補單列印助手</h1>
                    <p class="text-xs text-gray-500 mt-0.5">主管 14 欄標準格式（含「單位簽收人/日期」） • <strong>單頁橫式 A4 PDF 匯出（字體最大化）</strong></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-load-sample" class="px-3.5 py-1.5 text-xs font-medium text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-lg transition border border-teal-200">
                    📂 載入測試範例
                </button>
            </div>
        </header>

        <!-- 拖曳上傳區 -->
        <section class="no-print bg-white p-5 rounded-2xl shadow-sm border border-gray-200 upload-section space-y-3">
            <div id="dropzone" class="border-2 border-dashed border-gray-300 hover:border-teal-500 rounded-xl p-6 sm:p-8 text-center cursor-pointer transition-all bg-gray-50 hover:bg-teal-50/40 group">
                <input type="file" id="file-input" accept=".xlsx, .xls" class="hidden">
                <div class="space-y-2 pointer-events-none">
                    <div class="w-12 h-12 mx-auto rounded-full bg-teal-100 text-teal-700 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                        📥
                    </div>
                    <h2 class="text-base sm:text-lg font-semibold text-gray-700">拖放每週下載的 Excel 檔案至此處，或點擊選擇檔案</h2>
                    <p class="text-xs text-gray-500">支援系統匯出的 <code class="bg-gray-200 px-2 py-0.5 rounded text-xs text-gray-700">藥品材料申請單_*.xlsx</code></p>
                </div>
            </div>

            <!-- 檔案資訊列 -->
            <div id="file-info-bar" class="hidden flex flex-wrap items-center justify-between gap-3 p-3.5 bg-teal-50 border border-teal-200 rounded-xl text-teal-900">
                <div class="flex items-center gap-2.5">
                    <span class="text-lg">📋</span>
                    <div>
                        <p class="font-bold text-xs sm:text-sm" id="loaded-filename">已讀取檔案</p>
                        <p class="text-xs text-teal-700" id="loaded-file-meta">共 0 筆資料</p>
                    </div>
                </div>
                <button id="btn-clear" class="text-xs font-semibold text-red-600 hover:text-red-800 underline">
                    清除重新選擇
                </button>
            </div>
        </section>

        <!-- 控制面板：欄位自訂與列印設定 -->
        <section id="controls-section" class="no-print hidden bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-gray-100 pb-3">
                <div class="flex items-center gap-2">
                    <h3 class="font-bold text-gray-800 text-sm sm:text-base">⚙️ 欄位管理與設定</h3>
                    <span class="text-xs text-emerald-700 font-medium bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">已自動套用主管 14 欄標準格式</span>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="preset-target-btn" class="px-3 py-1.5 text-xs font-semibold bg-teal-700 text-white hover:bg-teal-800 rounded-md transition shadow-sm">
                        ⭐ 主管標準格式 (14欄)
                    </button>
                    <button id="select-all-btn" class="px-2.5 py-1.5 text-xs font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-md transition">
                        全選
                    </button>
                    <button id="deselect-all-btn" class="px-2.5 py-1.5 text-xs font-medium bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-md transition">
                        全消
                    </button>
                </div>
            </div>

            <!-- 欄位多選核取清單 -->
            <div id="columns-checkbox-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-2">
                <!-- 由 JavaScript 自動產生欄位開關 -->
            </div>

            <!-- 動作按鈕列 -->
            <div class="flex flex-wrap items-center justify-between gap-4 pt-3 border-t border-gray-100">
                <div class="flex items-center gap-4 text-xs sm:text-sm text-gray-600">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="hide-cancelled" class="rounded text-teal-600 focus:ring-teal-500" checked>
                        <span>排除取消/無法發料</span>
                    </label>
                </div>

                <!-- 動作按鈕組 -->
                <div class="flex flex-wrap items-center gap-2.5">
                    <button id="btn-export-excel" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-sm transition">
                        <span>📥</span> 匯出主管格式 Excel
                    </button>
                    <button id="btn-export-pdf" class="inline-flex items-center gap-1.5 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-bold shadow-md hover:shadow-lg transition">
                        <span>📄</span> 匯出主管格式 PDF (含 Excel)
                    </button>


                    <button id="btn-print" class="inline-flex items-center gap-1.5 px-4 py-2 bg-teal-700 hover:bg-teal-800 text-white rounded-xl text-xs sm:text-sm font-bold shadow-md hover:shadow-lg transition">
                        <span>🖨️</span> 列印預覽 (A4 橫向)
                    </button>
                </div>
            </div>
        </section>

        <!-- 列印與預覽區域 (標題大氣乾淨、簽核靠右) -->
        <main id="print-area" class="hidden bg-white p-3 sm:p-5 rounded-2xl shadow-sm border border-gray-200 space-y-2">
            
            <!-- 表頭主標題 (已移除副標題與日期筆數說明文字) -->
            <div class="text-center pb-2 border-b border-gray-300">
                <h2 class="text-lg sm:text-xl font-black text-gray-900 tracking-wider">佳里奇美醫院 藥劑科小藥撥補單</h2>
            </div>

            <!-- 資料表格 -->
            <div class="overflow-x-auto">
                <table class="preview-table print-table w-full text-left border-collapse">
                    <thead id="table-head">
                        <!-- 表頭由 JS 渲染 -->
                    </thead>
                    <tbody id="table-body">
                        <!-- 資料由 JS 渲染 -->
                    </tbody>
                </table>
            </div>

            <!-- 表尾簽核區 (簽名欄靠右放：發料藥佐、核對藥師) -->
            <div class="signature-block pt-3 mt-3 flex justify-end gap-10 text-xs sm:text-sm font-medium text-gray-800">
                <div>發料藥佐：____________________</div>
                <div>核對藥師：____________________</div>
            </div>

        </main>

        <!-- 初始空狀態提示 -->
        <div id="empty-state" class="no-print text-center py-12 text-gray-400">
            <p class="text-sm">請將系統匯出的 Excel 檔案拖入上方區域，或點擊右上角「載入測試範例」。</p>
        </div>

    </div>

    <script>
        const TARGET_FIELDS = [
            '申請單號', '申請時間', '申請單位', '費用部門代號', '申請人', 
            '送簽主管', '實際簽核主管', '發料日期', '領料品項名稱', '材料編號', 
            '單位', '申請數量', '發料數量', '單位簽收人/日期'
        ];

        const ALL_COLUMNS = [
            { id: '申請單號', name: '申請單號', defaultSelected: true },
            { id: '申請時間', name: '申請時間', defaultSelected: true },
            { id: '申請狀態', name: '申請狀態', defaultSelected: false },
            { id: '申請單位', name: '申請\n單位', defaultSelected: true },
            { id: '費用部門代號', name: '費用部門代號', defaultSelected: true },
            { id: '申請人', name: '申請人', defaultSelected: true },
            { id: '送簽主管', name: '送簽\n主管', defaultSelected: true },
            { id: '實際簽核主管', name: '實際簽核主管', defaultSelected: true },
            { id: '主管備註', name: '主管備註', defaultSelected: false },
            { id: '發料日期', name: '發料日期', defaultSelected: true },
            { id: '發料藥佐', name: '發料藥佐', defaultSelected: false },
            { id: '核對藥師', name: '核對藥師', defaultSelected: false },
            { id: '領料品項名稱', name: '領料品項名稱', defaultSelected: true },
            { id: '材料編號', name: '材料編號', defaultSelected: true },
            { id: '單位', name: '單位', defaultSelected: true },
            { id: '申請數量', name: '申請\n數量', defaultSelected: true },
            { id: '品項申請備註', name: '品項申請備註', defaultSelected: false },
            { id: '發料數量', name: '發料\n數量', defaultSelected: true },
            { id: '品項發料備註', name: '品項發料備註', defaultSelected: false },
            { id: '總備註', name: '總備註', defaultSelected: false },
            { id: '發料單位總備註', name: '發料單位總備註', defaultSelected: false },
            { id: '申請單位簽收人', name: '申請單位簽收人', defaultSelected: false },
            { id: '簽收時間', name: '簽收時間', defaultSelected: false },
            { id: '單位簽收人/日期', name: '單位簽收人/日期', defaultSelected: true }
        ];

        const STORAGE_KEY = 'cch_pharmacy_supervisor_cols_v5';

        let rawData = [];
        let filteredData = [];
        let selectedColumns = loadSavedColumns();

        function loadSavedColumns() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.error(e);
            }
            return [...TARGET_FIELDS];
        }

        function saveColumns(cols) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cols));
            } catch (e) {
                console.error(e);
            }
        }

        // DOM 元素
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const fileInfoBar = document.getElementById('file-info-bar');
        const loadedFilename = document.getElementById('loaded-filename');
        const loadedFileMeta = document.getElementById('loaded-file-meta');
        const btnClear = document.getElementById('btn-clear');
        const controlsSection = document.getElementById('controls-section');
        const columnsContainer = document.getElementById('columns-checkbox-container');
        const presetTargetBtn = document.getElementById('preset-target-btn');
        const selectAllBtn = document.getElementById('select-all-btn');
        const deselectAllBtn = document.getElementById('deselect-all-btn');
        const hideCancelledCheckbox = document.getElementById('hide-cancelled');
        const printArea = document.getElementById('print-area');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const emptyState = document.getElementById('empty-state');
        const btnPrint = document.getElementById('btn-print');
        const btnExportPdf = document.getElementById('btn-export-pdf');
        const btnExportExcel = document.getElementById('btn-export-excel');
        const btnLoadSample = document.getElementById('btn-load-sample');

        function init() {
            renderColumnCheckboxes();
            bindEvents();
        }

        function renderColumnCheckboxes() {
            columnsContainer.innerHTML = '';
            ALL_COLUMNS.forEach(col => {
                const label = document.createElement('label');
                label.className = "flex items-center gap-1.5 text-xs text-gray-700 bg-gray-50 hover:bg-teal-50 p-1.5 rounded border border-gray-200 cursor-pointer select-none transition";
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = col.id;
                cb.checked = selectedColumns.includes(col.id);
                cb.className = "rounded text-teal-600 focus:ring-teal-500";
                
                cb.addEventListener('change', () => {
                    if (cb.checked) {
                        if (!selectedColumns.includes(col.id)) selectedColumns.push(col.id);
                    } else {
                        selectedColumns = selectedColumns.filter(id => id !== col.id);
                    }
                    saveColumns(selectedColumns);
                    renderTable();
                });

                const span = document.createElement('span');
                span.textContent = col.id;
                if (TARGET_FIELDS.includes(col.id)) {
                    span.classList.add('font-semibold', 'text-teal-950');
                }

                label.appendChild(cb);
                label.appendChild(span);
                columnsContainer.appendChild(label);
            });
        }

        function bindEvents() {
            dropzone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);

            ['dragenter', 'dragover'].forEach(name => {
                dropzone.addEventListener(name, e => {
                    e.preventDefault(); e.stopPropagation();
                    dropzone.classList.add('dropzone-active');
                });
            });

            ['dragleave', 'drop'].forEach(name => {
                dropzone.addEventListener(name, e => {
                    e.preventDefault(); e.stopPropagation();
                    dropzone.classList.remove('dropzone-active');
                });
            });

            dropzone.addEventListener('drop', e => {
                const files = e.dataTransfer.files;
                if (files.length > 0) processFile(files[0]);
            });

            btnClear.addEventListener('click', resetAll);

            presetTargetBtn.addEventListener('click', () => {
                selectedColumns = [...TARGET_FIELDS];
                saveColumns(selectedColumns);
                renderColumnCheckboxes();
                renderTable();
            });

            selectAllBtn.addEventListener('click', () => {
                selectedColumns = ALL_COLUMNS.map(c => c.id);
                saveColumns(selectedColumns);
                renderColumnCheckboxes();
                renderTable();
            });

            deselectAllBtn.addEventListener('click', () => {
                selectedColumns = [];
                saveColumns(selectedColumns);
                renderColumnCheckboxes();
                renderTable();
            });

            hideCancelledCheckbox.addEventListener('change', processAndFilterData);

            btnPrint.addEventListener('click', () => window.print());
            btnExportPdf.addEventListener('click', exportToSinglePagePDF);
            btnExportExcel.addEventListener('click', exportCleanExcel);
            btnLoadSample.addEventListener('click', loadSampleData);
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) processFile(file);
        }

        function processFile(file) {
            loadedFilename.textContent = file.name;
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                    if (!json || json.length === 0) {
                        alert('檔案中無資料！');
                        return;
                    }

                    rawData = json.map(r => {
                        if (!('單位簽收人/日期' in r)) {
                            r['單位簽收人/日期'] = '';
                        }
                        return r;
                    });

                    fileInfoBar.classList.remove('hidden');
                    controlsSection.classList.remove('hidden');
                    printArea.classList.remove('hidden');
                    emptyState.classList.add('hidden');

                    processAndFilterData();

                } catch (err) {
                    console.error("Excel 解析錯誤:", err);
                    alert("檔案解析失敗，請確認是否為有效之 Excel 檔案。");
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function processAndFilterData() {
            if (!rawData || rawData.length === 0) return;

            let list = [...rawData];

            if (hideCancelledCheckbox.checked) {
                list = list.filter(row => {
                    const status = row['申請狀態'] || '';
                    return status !== '申請取消' && status !== '無法發料' && status !== '主管退回';
                });
            }

            filteredData = list;
            loadedFileMeta.textContent = `共 ${rawData.length} 筆 (呈現 ${filteredData.length} 筆)`;

            renderTable();
        }

        const COL_PERCENTAGES = {
            '申請單號': '7.5%',
            '申請時間': '10.0%',
            '申請單位': '5.0%',
            '費用部門代號': '5.5%',
            '申請人': '4.5%',
            '送簽主管': '4.5%',
            '實際簽核主管': '5.5%',
            '發料日期': '5.5%',
            '領料品項名稱': '20.0%',
            '材料編號': '11.5%',
            '單位': '3.5%',
            '申請數量': '4.0%',
            '發料數量': '4.0%',
            '單位簽收人/日期': '9.0%'
        };

        function renderTable() {
            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            const table = printArea.querySelector('table');
            table.style.tableLayout = 'fixed';
            table.style.width = '100%';

            // 移除舊 colgroup
            const oldColgroup = table.querySelector('colgroup');
            if (oldColgroup) table.removeChild(oldColgroup);

            // 建立固定比例 colgroup，保證每一欄有充足空間，絕不溢出重疊
            const colgroup = document.createElement('colgroup');
            selectedColumns.forEach(colId => {
                const col = document.createElement('col');
                col.style.width = COL_PERCENTAGES[colId] || '7%';
                colgroup.appendChild(col);
            });
            table.insertBefore(colgroup, tableHead);

            if (selectedColumns.length === 0) {
                tableBody.innerHTML = `<tr><td class="text-center py-6 text-gray-400">尚未勾選任何欄位。</td></tr>`;
                return;
            }

            // 表頭
            const headerRow = document.createElement('tr');
            headerRow.className = "bg-gray-100 font-bold border-b border-gray-400";

            selectedColumns.forEach(colId => {
                const th = document.createElement('th');
                const colDef = ALL_COLUMNS.find(c => c.id === colId);
                th.textContent = colDef ? colDef.name : colId;
                th.style.padding = '3px 2px';
                th.style.fontSize = '9.5px';
                th.style.lineHeight = '1.15';
                th.style.textAlign = 'center';
                th.style.border = '0.8px solid #475569';
                th.style.overflow = 'hidden';
                th.style.boxSizing = 'border-box';
                th.style.whiteSpace = 'pre-line';

                if (colId === '單位簽收人/日期') {
                    th.classList.add('bg-emerald-50', 'text-emerald-950');
                }
                headerRow.appendChild(th);
            });
            tableHead.appendChild(headerRow);

            // 內容列 (嚴格鎖定欄寬與文字防溢出)
            filteredData.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.className = idx % 2 === 0 ? "bg-white" : "bg-gray-50/70";

                selectedColumns.forEach(colId => {
                    const td = document.createElement('td');
                    let val = row[colId] ?? '';

                    if (val instanceof Date) {
                        val = val.toLocaleString('zh-TW', { hour12: false });
                    }

                    td.textContent = val;
                    td.style.padding = '2px 3px';
                    td.style.fontSize = '9px';
                    td.style.lineHeight = '1.15';
                    td.style.border = '0.8px solid #475569';
                    td.style.boxSizing = 'border-box';
                    td.style.overflow = 'hidden';

                    if (colId === '領料品項名稱') {
                        td.style.textAlign = 'left';
                        td.style.fontWeight = '500';
                        td.style.whiteSpace = 'normal';
                        td.style.wordBreak = 'break-all';
                    } else if (colId === '材料編號') {
                        td.style.textAlign = 'center';
                        td.style.fontFamily = 'monospace';
                        td.style.fontSize = '8.2px';
                        td.style.whiteSpace = 'nowrap';
                    } else if (colId === '單位簽收人/日期') {
                        td.style.textAlign = 'center';
                    } else if (colId.includes('數量') || colId === '單位') {
                        td.style.textAlign = 'center';
                        td.style.fontWeight = '600';
                        td.style.whiteSpace = 'nowrap';
                    } else {
                        td.style.textAlign = 'center';
                        td.style.whiteSpace = 'nowrap';
                        td.style.textOverflow = 'ellipsis';
                    }

                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        // --- 核心：匯出主管格式 (先自動下載 Excel，再精準產出絕不留白之 PDF) ---
        async function exportToSinglePagePDF() {
            if (!filteredData || filteredData.length === 0) {
                alert('無可匯出之資料');
                return;
            }

            btnExportPdf.disabled = true;
            btnExportPdf.innerHTML = '<span>⏳</span> 正在下載 Excel 並產生 PDF...';

            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
            const pdfFilename = `藥品材料申請單_主管格式_A4橫式_${dateStr}.pdf`;

            // 1. 自動先下載主管正確格式 Excel 檔
            try {
                exportCleanExcel();
            } catch (e) {
                console.error("Excel 匯出失敗:", e);
            }

            // 2. 暫時隱藏上方控制項，讓表格自然直頂頁面 (offsetTop = 0)，徹底消滅空白首頁與幽靈元素問題！
            const headerEl = document.querySelector('header');
            const uploadEl = document.querySelector('.upload-section');
            const controlsEl = document.getElementById('controls-section');
            const printElement = document.getElementById('print-area');
            const scrollContainer = printElement.querySelector('.overflow-x-auto');

            const prevHeaderDisplay = headerEl ? headerEl.style.display : '';
            const prevUploadDisplay = uploadEl ? uploadEl.style.display : '';
            const prevControlsDisplay = controlsEl ? controlsEl.style.display : '';
            const prevScrollLeft = scrollContainer ? scrollContainer.scrollLeft : 0;
            const prevOverflow = scrollContainer ? scrollContainer.style.overflow : '';

            try {
                if (headerEl) headerEl.style.display = 'none';
                if (uploadEl) uploadEl.style.display = 'none';
                if (controlsEl) controlsEl.style.display = 'none';
                if (scrollContainer) {
                    scrollContainer.scrollLeft = 0;
                    scrollContainer.style.overflow = 'visible';
                }

                window.scrollTo(0, 0);
                // 等待 150ms 讓瀏覽器完成重繪
                await new Promise(r => setTimeout(r, 150));

                const opt = {
                    margin: [5, 6, 5, 6], // 上下 5mm，左右 6mm 保證左右兩側 100% 不裁切
                    filename: pdfFilename,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 2, 
                        useCORS: true, 
                        logging: false,
                        backgroundColor: '#ffffff',
                        scrollX: 0,
                        scrollY: 0
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                    pagebreak: { mode: 'legacy' }
                };

                await html2pdf().set(opt).from(printElement).save();

            } catch (err) {
                console.error("PDF 產出失敗:", err);
                alert("PDF 產出失敗，請改用「列印預覽 (A4 橫向)」按鈕並在列印視窗選擇「另存為 PDF」。");
            } finally {
                // 恢復原始畫面結構
                if (headerEl) headerEl.style.display = prevHeaderDisplay;
                if (uploadEl) uploadEl.style.display = prevUploadDisplay;
                if (controlsEl) controlsEl.style.display = prevControlsDisplay;
                if (scrollContainer) {
                    scrollContainer.scrollLeft = prevScrollLeft;
                    scrollContainer.style.overflow = prevOverflow;
                }
                btnExportPdf.disabled = false;
                btnExportPdf.innerHTML = '<span>📄</span> 匯出主管格式 PDF (含 Excel)';
            }
        }








        // 匯出主管格式 Excel
        function exportCleanExcel() {
            if (!filteredData || filteredData.length === 0) {
                alert('無可匯出之資料');
                return;
            }

            const headerMap = {
                '申請單位': '申請\n單位',
                '送簽主管': '送簽\n主管',
                '申請數量': '申請\n數量',
                '發料數量': '發料\n數量'
            };

            const exportList = filteredData.map(row => {
                const cleanRow = {};
                selectedColumns.forEach(colId => {
                    const displayHeader = headerMap[colId] || colId;
                    cleanRow[displayHeader] = row[colId] ?? '';
                });
                return cleanRow;
            });

            const worksheet = XLSX.utils.json_to_sheet(exportList);

            worksheet['!cols'] = selectedColumns.map(colId => {
                if (colId === '領料品項名稱') return { wch: 28 };
                if (colId === '申請時間') return { wch: 20 };
                if (colId === '單位簽收人/日期') return { wch: 18 };
                if (colId === '材料編號') return { wch: 16 };
                if (colId === '申請單號') return { wch: 14 };
                if (colId === '實際簽核主管') return { wch: 13 };
                if (colId === '費用部門代號') return { wch: 13 };
                if (colId === '發料日期') return { wch: 12 };
                if (colId === '申請單位') return { wch: 11 };
                if (colId === '申請人' || colId === '送簽主管') return { wch: 10 };
                if (colId.includes('數量')) return { wch: 10 };
                if (colId === '單位') return { wch: 8 };
                return { wch: 12 };
            });

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '藥品材料申請單');

            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
            XLSX.writeFile(workbook, `藥品材料申請單_主管正確格式_${dateStr}.xlsx`);
        }
